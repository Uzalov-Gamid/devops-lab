name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest


  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t devops-lab-api .

      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 devops-lab-api
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
